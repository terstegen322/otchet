<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Отчёт дня</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#6a737d; --accent:#1f6feb; --line:#e2e5e9; --ok:#1a7f37; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1318; --card:#181d24; --text:#e8ecf1; --muted:#8b95a1; --accent:#4c8dff; --line:#2a313a; --ok:#3fb950; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, sans-serif; padding:12px 16px 120px; }
  h1 { font-size:20px; margin:8px 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  label.row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0; }
  input[type=number], input[type=text], textarea {
    width:100%; font:inherit; color:var(--text); background:var(--bg);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px;
  }
  textarea { min-height:84px; resize:vertical; }
  .num { width:130px !important; text-align:right; }
  .tg { display:flex; gap:6px; }
  .tg button { flex:1; font:inherit; padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  .tg button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .tgrow { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0; }
  .hint { color:var(--muted); font-size:13px; margin:4px 0 0; }
  details summary { cursor:pointer; color:var(--muted); padding:4px 0; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .chips label { border:1px solid var(--line); border-radius:20px; padding:6px 12px; background:var(--bg); }
  .chips input { margin-right:6px; }
  pre#out { white-space:pre-wrap; word-break:break-word; margin:0; font:inherit; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid var(--line); display:flex; gap:10px; }
  .bar button { flex:1; font:600 16px system-ui; padding:14px; border-radius:12px; border:0; background:var(--accent); color:#fff; }
  .bar button.sec { background:var(--bg); color:var(--text); border:1px solid var(--line); flex:0 0 auto; }
  .err { color:#d1242f; margin:6px 0; }
  .ok { color:var(--ok); }
  .btnline { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .btnline button, .btnline label.btn { font:inherit; padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
</style>
</head>
<body>
<h1>📝 Отчёт дня</h1>

<div class="card" id="srcCard">
  <div id="status" class="hint">Данные FatSecret не загружены. Нажмите «Поделиться» в FatSecret и выберите это приложение, либо загрузите файл вручную.</div>
  <div class="btnline">
    <label class="btn">📂 Выбрать CSV<input id="file" type="file" accept=".csv,.CSV,text/*" hidden></label>
    <button id="pasteBtn" type="button">📋 Вставить текст</button>
  </div>
  <div id="err" class="err"></div>
</div>

<div class="card">
  <div class="tgrow"><span>Английский</span><div class="tg" data-k="english"><button data-v="1" class="on">✅</button><button data-v="0">❌</button></div></div>
  <label class="row"><span>Шаги</span><input id="steps" class="num" type="number" inputmode="numeric" placeholder="0"></label>
  <div class="tgrow"><span>Тренировка</span><div class="tg" data-k="workout"><button data-v="1" class="on">✅</button><button data-v="0">❌</button></div></div>
  <div id="exWrap">
    <textarea id="ex" placeholder="отжимания 150&#10;приседания 10"></textarea>
    <p class="hint">Каждое упражнение с новой строки или через запятую: название и число.</p>
  </div>
</div>

<div class="card">
  <details>
    <summary>⚙️ Настройки</summary>
    <label class="row"><span>Цель по калориям</span><input id="calGoal" class="num" type="number" inputmode="numeric"></label>
    <label class="row"><span>Цель по шагам</span><input id="stepsGoal" class="num" type="number" inputmode="numeric"></label>
    <label class="row"><span>Номер дня (необязательно)</span><input id="dayNum" class="num" type="number" inputmode="numeric" placeholder="—"></label>
    <div class="chips" id="chips"></div>
    <label class="row"><span>Калории по приёмам пищи</span><input id="meals" type="checkbox"></label>
  </details>
</div>

<div class="card"><pre id="out">Здесь появится пост…</pre></div>

<div class="bar">
  <button class="sec" id="shareBtn" type="button">↗︎</button>
  <button id="copyBtn" type="button">Скопировать пост</button>
</div>

<script src="parser.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  const state = { diary: null, english: 1, workout: 1 };

  // настройки
  $('calGoal').value = LS.get('calGoal', 2000);
  $('stepsGoal').value = LS.get('stepsGoal', 10000);
  $('meals').checked = LS.get('meals', false);
  const selected = LS.get('nutrients', Diary.NUTRIENTS.filter(n => n.def).map(n => n.key));
  Diary.NUTRIENTS.forEach(n => {
    const l = document.createElement('label');
    l.innerHTML = '<input type="checkbox" value="' + n.key + '"' + (selected.includes(n.key) ? ' checked' : '') + '>' + n.label;
    $('chips').appendChild(l);
  });

  function nutrients() {
    return [...document.querySelectorAll('#chips input:checked')].map(i => i.value);
  }

  // переключатели ✅/❌
  document.querySelectorAll('.tg').forEach(g => {
    g.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      g.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      state[g.dataset.k] = +b.dataset.v;
      if (g.dataset.k === 'workout') $('exWrap').style.display = state.workout ? '' : 'none';
      render();
    });
  });

  function dateKey(d) { return d ? `${d.year}-${d.month}-${d.day}` : ''; }

  function render() {
    if (!state.diary) { $('out').textContent = 'Здесь появится пост…'; return; }
    const post = Diary.buildPost({
      diary: state.diary,
      english: state.english,
      steps: +$('steps').value || 0,
      stepsGoal: +$('stepsGoal').value || 10000,
      workout: state.workout,
      exercises: $('ex').value,
      calGoal: +$('calGoal').value || 2000,
      nutrients: nutrients(),
      showMeals: $('meals').checked,
      dayNumber: $('dayNum').value,
    });
    $('out').textContent = post;
    LS.set('calGoal', +$('calGoal').value || 2000);
    LS.set('stepsGoal', +$('stepsGoal').value || 10000);
    LS.set('meals', $('meals').checked);
    LS.set('nutrients', nutrients());
  }

  function load(text) {
    $('err').textContent = '';
    try {
      state.diary = Diary.parseDiary(text);
    } catch (e) {
      state.diary = null;
      $('err').textContent = e.message;
      render();
      return;
    }
    const d = state.diary.date;
    $('status').innerHTML = '<span class="ok">✔ Загружено:</span> ' + (d ? `${d.weekday}, ${d.day} ${d.month}` : 'без даты') + ', ' + Math.round(state.diary.totals.cal) + ' ккал';

    // номер дня: +1, если дата новая
    const saved = LS.get('day', null);
    if (saved && saved.num) {
      $('dayNum').value = saved.key === dateKey(d) ? saved.num : saved.num + 1;
    }
    render();
  }

  // события
  ['steps', 'ex', 'calGoal', 'stepsGoal', 'dayNum', 'meals'].forEach(id => $(id).addEventListener('input', render));
  $('chips').addEventListener('change', render);

  $('file').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    load(await f.text());
  });
  $('pasteBtn').addEventListener('click', async () => {
    let t = '';
    try { t = await navigator.clipboard.readText(); } catch (e) {}
    if (!t) t = prompt('Вставьте содержимое CSV') || '';
    if (t) load(t);
  });

  function remember() {
    const n = +$('dayNum').value;
    if (n && state.diary) LS.set('day', { num: n, key: dateKey(state.diary.date) });
  }

  $('copyBtn').addEventListener('click', async () => {
    const text = $('out').textContent;
    if (!state.diary) return;
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const r = document.createRange(); r.selectNodeContents($('out'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy');
    }
    remember();
    const b = $('copyBtn'); const old = b.textContent;
    b.textContent = 'Скопировано ✔'; setTimeout(() => b.textContent = old, 1500);
  });

  $('shareBtn').addEventListener('click', () => {
    if (!state.diary) return;
    remember();
    if (navigator.share) navigator.share({ text: $('out').textContent }).catch(() => {});
    else window.open('https://t.me/share/url?url=%20&text=' + encodeURIComponent($('out').textContent));
  });

  // файл, пришедший через «Поделиться»
  (async function () {
    if (!/[?&]shared=1/.test(location.search)) return;
    try {
      const c = await caches.open('shared');
      const r = await c.match('shared-csv');
      if (r) { const t = await r.text(); await c.delete('shared-csv'); if (t) load(t); }
    } catch (e) {}
    history.replaceState(null, '', location.pathname);
  })();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
